<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator</title>
</head>
<body>
    <script>
        let a=50;
        let b=30;
        let c=a+b;
        document.write("value of c is=="+c); 
        let d=a-b;
        document.write("value of d is=="+d);
        let e=a*b;
        document.write("value of e is=="+e);
        let f=a/b;
        document.write("value of f is=="+f); 
        let g=a%b;
        document.write("value of g is=="+g);
    </script>
</body>
</html>
